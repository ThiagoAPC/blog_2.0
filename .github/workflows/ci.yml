name: CI — Build Check

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: ./site

      - name: Sync Astro types
        run: npx astro sync
        working-directory: ./site

      - name: Type check
        run: npx astro check
        working-directory: ./site
        continue-on-error: true

      - name: Build site
        run: npx astro build
        working-directory: ./site
